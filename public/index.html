<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCIM同期先デモアプリ</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header><div><span class="badge">SCIMサーバ</span><h1>SCIM同期先デモアプリ</h1><p>Auth0 Event Streamsから連携されたユーザー情報</p></div><div id="status" class="status">接続確認中</div></header>
  <main>
    <section class="summary">
      <div><span>同期ユーザー</span><strong id="count">0</strong></div>
      <div><span>最終同期</span><strong id="lastSync">-</strong></div>
      <button id="reload">最新情報に更新</button>
    </section>
    <section class="panel">
      <div class="panel-title"><h2>ユーザー一覧</h2><span>SCIM externalIdでAuth0ユーザーと紐付け</span></div>
      <div class="table-wrap"><table><thead><tr>
        <th>表示名</th>
        <th>ユーザー名</th>
        <th>externalId</th>
        <th>カスタム属性</th>
        <th>状態</th>
        <th>更新日時</th>
        
      </tr></thead>
      <tbody id="users"></tbody></table></div>
      <div id="empty" class="empty">まだユーザーが同期されていません。</div>
    </section>
    <section class="panel"><div class="panel-title"><h2>直近のSCIM処理</h2><span>デモ時の動作確認用</span></div><div id="logs" class="logs"></div></section>
  </main>
  <dialog id="dialog"><div class="dialog-head"><h3>SCIM User JSON</h3><button id="close">×</button></div><pre id="json"></pre></dialog>
  <script src="/app.js"></script>
</body>
</html>
